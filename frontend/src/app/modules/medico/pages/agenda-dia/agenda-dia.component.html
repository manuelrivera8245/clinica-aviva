<app-navbar></app-navbar>
<div class="d-flex">
  <app-sidebar titulo="Portal Médico" [items]="menuItems"></app-sidebar>
  <main class="panel-layout flex-grow-1">
    <div class="page-header-aviva d-flex justify-content-between align-items-center">
      <div>
        <h2><i class="fas fa-calendar-day me-2"></i>Agenda del Día</h2>
        <p class="text-muted mb-0">Citas programadas para hoy</p>
      </div>
      <button class="btn btn-outline-primary" (click)="cargar()" id="btn-refrescar-agenda">
        <i class="fas fa-sync-alt me-2"></i>Actualizar
      </button>
    </div>

    <app-loading-spinner [visible]="cargando"></app-loading-spinner>

    <div class="card-aviva" *ngIf="!cargando">
      <div class="table-responsive" *ngIf="citas.length > 0">
        <table class="table table-aviva table-hover mb-0">
          <thead>
            <tr>
              <th>Hora</th><th>Paciente</th><th>DNI</th><th>Teléfono</th><th>Estado</th><th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of citas">
              <td class="fw-bold">{{ c.horaInicio | slice:0:5 }}</td>
              <td>{{ c.nombrePaciente }}</td>
              <td class="text-muted">{{ c.dniPaciente }}</td>
              <td>{{ c.telefonoPaciente }}</td>
              <td>
                <span class="estado-badge"
                  [ngClass]="{
                    'estado-programada':  c.estado === 'Programada',
                    'estado-atendida':    c.estado === 'Atendida',
                    'estado-no-asistio':  c.estado === 'No Asistio',
                    'estado-cancelada':   c.estado === 'Cancelada'
                  }">{{ c.estado }}</span>
              </td>
              <td class="text-center">
                <div class="d-flex gap-2 justify-content-center" *ngIf="c.estado === 'Programada'">
                  <button class="btn btn-success btn-sm" (click)="marcarAtendido(c)"
                          [id]="'btn-atendido-' + c.idCita">
                    <i class="fas fa-check me-1"></i>Atendido
                  </button>
                  <button class="btn btn-warning btn-sm text-dark" (click)="marcarNoAsistio(c)"
                          [id]="'btn-noasistio-' + c.idCita">
                    <i class="fas fa-user-slash me-1"></i>No Asistió
                  </button>
                </div>
                <span class="text-muted small" *ngIf="c.estado !== 'Programada'">—</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="p-5 text-center text-muted" *ngIf="citas.length === 0">
        <i class="fas fa-calendar-times fa-3x mb-3"></i>
        <p class="mb-0">No hay citas programadas para hoy.</p>
      </div>
    </div>
  </main>
</div>
