<app-navbar></app-navbar>
<div class="d-flex">
  <app-sidebar titulo="Portal Médico" [items]="menuItems"></app-sidebar>
  <main class="panel-layout flex-grow-1">
    <div class="page-header-aviva d-flex justify-content-between align-items-center">
      <h2><i class="fas fa-tasks me-2"></i>Gestión de Citas</h2>
      <select class="form-select w-auto" [(ngModel)]="filtroEstado" id="filtro-estado-medico">
        <option value="todos">Todos</option>
        <option value="Programada">Programada</option>
        <option value="Atendida">Atendida</option>
        <option value="No Asistio">No Asistió</option>
        <option value="Cancelada">Cancelada</option>
      </select>
    </div>
    <app-loading-spinner [visible]="cargando"></app-loading-spinner>
    <div class="card-aviva" *ngIf="!cargando">
      <div class="table-responsive" *ngIf="citasFiltradas.length > 0">
        <table class="table table-aviva table-hover mb-0">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Paciente</th>
              <th>DNI</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of citasFiltradas">
              <td>{{ c.fechaCita | date:'dd/MM/yyyy':'':'es' }}</td>
              <td>{{ c.horaInicio | slice:0:5 }}</td>
              <td>{{ c.nombrePaciente }}</td>
              <td class="text-muted">{{ c.dniPaciente }}</td>
              <td>
                <span class="estado-badge" [ngClass]="{
                  'estado-programada': c.estado==='Programada',
                  'estado-atendida':   c.estado==='Atendida',
                  'estado-no-asistio': c.estado==='No Asistio',
                  'estado-cancelada':  c.estado==='Cancelada'
                }">{{ c.estado }}</span>
              </td>
              <td class="text-center">
                <!-- Botones solo para citas aún Programadas -->
                <div class="d-flex gap-2 justify-content-center" *ngIf="c.estado === 'Programada'">
                  <button class="btn btn-success btn-sm"
                          (click)="marcarAtendido(c)"
                          [id]="'btn-gestionar-atendido-' + c.idCita"
                          title="Marcar como Atendida">
                    <i class="fas fa-check me-1"></i>Atendido
                  </button>
                  <button class="btn btn-warning btn-sm text-dark"
                          (click)="marcarNoAsistio(c)"
                          [id]="'btn-gestionar-noasistio-' + c.idCita"
                          title="Marcar como No Asistió">
                    <i class="fas fa-user-slash me-1"></i>No Asistió
                  </button>
                </div>
                <!-- Citas ya cerradas: mostrar guión -->
                <span class="text-muted small" *ngIf="c.estado !== 'Programada'">—</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="p-5 text-center text-muted" *ngIf="citasFiltradas.length === 0">
        <i class="fas fa-clipboard-list fa-3x mb-3"></i><p>No hay citas con ese estado.</p>
      </div>
    </div>
  </main>
</div>
